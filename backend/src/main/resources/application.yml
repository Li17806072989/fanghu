server:
  port: 8081
spring:
  application:
    name: fanghu-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fang_hu}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # Keep the standalone backend history separate from the optional RuoYi admin app.
    table: fanghu_schema_history
    baseline-on-migrate: true
    # Existing databases can be adopted once with FLYWAY_BASELINE_VERSION=16;
    # fresh databases keep the default baseline at 0 and run V1 onward.
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    locations: classpath:db/migration
    validate-on-migrate: true
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
sa-token:
  token-name: fanghu-token
  # Allow one account to use independent sessions on multiple browsers or devices.
  is-concurrent: true
  is-share: false
  max-login-count: 20
fanghu:
  auth:
    login-rate:
      account-limit: ${LOGIN_ACCOUNT_ATTEMPT_LIMIT:10}
      ip-limit: ${LOGIN_IP_ATTEMPT_LIMIT:30}
      window-seconds: ${LOGIN_ATTEMPT_WINDOW_SECONDS:300}
    captcha-rate:
      ip-limit: ${CAPTCHA_IP_REQUEST_LIMIT:60}
      window-seconds: ${CAPTCHA_REQUEST_WINDOW_SECONDS:60}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:}
    code-expire-seconds: ${SMS_CODE_EXPIRE_SECONDS:300}
    send-interval-seconds: ${SMS_SEND_INTERVAL_SECONDS:60}
    daily-limit: ${SMS_DAILY_LIMIT:20}
    expose-code: ${SMS_EXPOSE_CODE:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Local fallback keeps the backend usable when started directly from IDEA.
    # Production must provide FANGHU_MINIO_ACCESS_KEY and FANGHU_MINIO_SECRET_KEY explicitly.
    access-key: ${FANGHU_MINIO_ACCESS_KEY:${MINIO_ROOT_USER:fanghuadmin}}
    secret-key: ${FANGHU_MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:fanghu_minio_2026}}
    bucket: ${MINIO_BUCKET:fanghu-private}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY_SECONDS:900}
  clamav:
    enabled: ${CLAMAV_ENABLED:true}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-millis: ${CLAMAV_TIMEOUT_MILLIS:30000}
  ai:
    endpoint: ${AI_API_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
management:
  endpoints:
    web:
      exposure:
        include: health,info
