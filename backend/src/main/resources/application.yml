server:
  port: 8081
spring:
  application:
    name: fanghu-platform
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:fang_hu}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: never
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
sa-token:
  token-name: fanghu-token
  # Allow one account to use independent sessions on multiple browsers or devices.
  is-concurrent: true
  is-share: false
  max-login-count: 20
fanghu:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:fanghu-private}
    presign-expiry-seconds: ${MINIO_PRESIGN_EXPIRY_SECONDS:900}
  clamav:
    enabled: ${CLAMAV_ENABLED:true}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout-millis: ${CLAMAV_TIMEOUT_MILLIS:30000}
  ai:
    endpoint: ${AI_API_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
management:
  endpoints:
    web:
      exposure:
        include: health,info
