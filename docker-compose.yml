services:
  mysql:
    image: mysql:8.0.36
    container_name: fanghu-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: fang_hu
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["fanghu_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2.5-alpine
    container_name: fanghu-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes: ["fanghu_redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: fanghu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: ["fanghu_minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T23-04-32Z
    container_name: fanghu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set fanghu http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing fanghu/fanghu-private && mc anonymous set none fanghu/fanghu-private
    restart: "no"
  clamav:
    image: clamav/clamav:1.4.1
    container_name: fanghu-clamav
    restart: unless-stopped
    volumes: ["fanghu_clamav:/var/lib/clamav"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
  backend:
    build:
      context: ./backend
    container_name: fanghu-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports: ["8081:8081"]
  frontend:
    image: nginx:1.27.1-alpine
    container_name: fanghu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports: ["80:80"]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  fanghu_mysql:
  fanghu_redis:
  fanghu_minio:
  fanghu_clamav:
