# 测试环境配置。所有凭据必须由 CI/CD 环境变量提供，不使用内置密码。
server:
  port: ${SERVER_PORT:18081}

spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${MYSQL_USER}
          password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

fanghu:
  payment:
    mock-enabled: ${FANGHU_PAYMENT_MOCK_ENABLED:true}
    expiry-check-ms: ${FANGHU_PAYMENT_EXPIRY_CHECK_MS:300000}
  registration:
    enabled: true
  bootstrap-admin:
    enabled: false
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
  storage:
    max-file-size-bytes: ${FANGHU_MAX_FILE_SIZE_BYTES:10485760}
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST}
    port: ${CLAMAV_PORT}
  ai:
    endpoint: ${AI_API_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL}
